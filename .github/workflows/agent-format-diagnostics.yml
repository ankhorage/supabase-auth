name: Agent Format Diagnostics

on:
  push:
    branches:
      - agent/phase2-oauth-provider-definitions

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-oauth-provider-definitions
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'
      - run: bun install --frozen-lockfile
      - run: bun run format:check > format-output.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add format-output.txt
          git commit -m "ci: capture format diagnostics"
          git push origin HEAD:agent/phase2-oauth-provider-definitions
