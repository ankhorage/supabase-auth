name: Agent Format Docs

on:
  push:
    branches:
      - agent/phase2-oauth-provider-definitions

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase2-oauth-provider-definitions
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"
      - run: bun install --frozen-lockfile
      - run: bun x ankhorage-prettier --write paradox README.md
      - name: Commit formatted docs
        run: |
          rm -f format-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "docs: format generated documentation"
          git push origin HEAD:agent/phase2-oauth-provider-definitions
