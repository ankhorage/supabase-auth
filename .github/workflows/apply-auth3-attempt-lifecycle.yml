name: Apply auth3 attempt lifecycle

on:
  push:
    branches:
      - agent/auth-3-expiring-oauth-attempts

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/auth-3-expiring-oauth-attempts
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Apply bounded OAuth attempt lifecycle
        run: |
          python scripts/apply-auth3-attempt-lifecycle.py
          python scripts/fix-auth3-test-calls.py
          nl -ba src/oauthAttemptLifecycle.test.ts | sed -n '98,108p;183,193p'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply repository formatting
        run: |
          bun run lint:fix
          bun run format

      - name: Validate package
        run: |
          bun run build
          bun run test
          npm pack --dry-run

      - name: Commit validated implementation and remove helper files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-auth3-attempt-lifecycle.yml
          git rm scripts/apply-auth3-attempt-lifecycle.py
          git rm scripts/fix-auth3-test-calls.py
          git add -A
          git commit -m "Add expiring OAuth attempt recovery"
          git push
