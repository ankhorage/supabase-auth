name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install

      - name: Apply canonical formatting
        run: |
          bun run lint:fix
          bun run format

      - name: Run build
        run: bun run build

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Run typecheck
        run: bun run typecheck

      - name: Run Knip
        run: bun run knip

      - name: Generate docs
        run: bun run docs

      - name: Check changesets
        if: github.event_name == 'pull_request'
        run: bash ./scripts/check-changeset-status.sh

      - name: Commit bootstrap output
        if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
        run: |
          git restore .github/workflows
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: bootstrap OAuth provider registry"
          git push origin HEAD:${{ github.head_ref }}
