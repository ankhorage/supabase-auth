name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase3/complete-oauth-account-lifecycle
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply lifecycle correction
        run: node scripts/phase3-complete-lifecycle.mjs

      - name: Format and lint source
        run: |
          bun run lint:fix
          bun run format
          git checkout -- README.md paradox || true

      - name: Capture validation
        run: |
          set +e
          {
            bun run build
            bun run lint
            bun run test
            bun run typecheck
          } > phase3-lifecycle-validation.txt 2>&1
          exit 0

      - name: Commit corrected source and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/createSupabaseAuthAdapter.ts src/oauth.ts src/profileVerification.ts phase3-lifecycle-validation.txt
          git commit -m "fix: validate complete OAuth lifecycle source"
          git push
