name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Setup Node for npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build package
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts?.build ? 0 : 1)"; then
            bun run build
          else
            echo "No build script found; skipping."
          fi

      - name: Create release pull request or publish to npm
        if: hashFiles('.changeset/config.json') != ''
        uses: changesets/action@v1
        with:
          version: bun run version-packages
          publish: bun run changeset -- publish
          commit: Version Packages
          title: Version Packages
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Finalize Changesets v3 tags and GitHub releases
        if: hashFiles('.changeset/config.json') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --points-at HEAD | while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi
            git push origin "refs/tags/$tag"
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release create "$tag" --repo "$GITHUB_REPOSITORY" --generate-notes
            fi
          done

      - name: Skip release
        if: hashFiles('.changeset/config.json') == ''
        run: echo "No Changesets config found; skipping release."
